<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}

.ps{font-family:"Noto Naskh Arabic","Scheherazade New",Tahoma,Arial,sans-serif;direction:rtl}

.ib{background:none;border:0;color:#fff;font-size:26px;width:42px;height:42px;border-radius:50%}

.tog{display:flex;gap:8px;margin-top:10px}
.tog button,.sel{flex:1;padding:9px;border-radius:20px;border:1px solid #fff8;background:transparent;color:#fff;font-size:14px}
.tog button.on{background:#fff;color:var(--g2);font-weight:700}
.sel{background:var(--g2);appearance:none;text-align:center}
.info{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;color:var(--mut)}
.main{flex:1;display:flex;min-height:0}
#list{flex:1;overflow-y:auto;background:var(--card);margin:0 0 0 8px;border-radius:12px 0 0 12px}
.az{width:24px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;font-size:11px;color:var(--g);text-align:center;font-weight:700}
.az span{flex:1;display:flex;align-items:center;justify-content:center}
.az span.on{background:var(--g);color:#fff;border-radius:6px}
.it{border-bottom:1px solid var(--sep);padding:12px 12px}
.row{display:flex;align-items:center;gap:8px}
.wd{flex:1}
.wd b{font-size:17px;display:block}
.wd .p{font-size:17px;color:var(--g);margin-top:2px}
:root[data-theme=dark] .wd .p{color:#6fd08a}
.heart{background:none;border:0;font-size:24px;color:var(--mut)}
.heart.f{color:#e53950}
.det{display:none;margin-top:10px;background:var(--acc);border-radius:10px;padding:10px;font-size:14px;line-height:1.6}
.it.open .det{display:block}
.det .ps{font-size:16px;margin-top:6px}
.tag{display:inline-block;font-size:11px;background:var(--g);color:#fff;border-radius:10px;padding:2px 8px;margin-top:6px}
.spk{margin-top:8px;background:var(--g);color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
#ov{position:fixed;inset:0;background:#0007;display:none;z-index:5}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);transform:translateX(-100%);transition:.25s;z-index:6;display:flex;flex-direction:column}
#dr.o{transform:none}
#dr h2{background:var(--g);color:#fff;margin:0;padding:22px 16px;font-size:18px}
#dr a{padding:16px;border-bottom:1px solid var(--sep);font-size:16px}

.modal .bx{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:360px;line-height:1.8}
.modal h3{margin:0 0 8px;color:var(--g)}
.modal button{margin-top:12px;background:var(--g);color:#fff;border:0;border-radius:18px;padding:9px 20px}

$("tot").textContent="Total: "+D.length;

function render(){
  const q=$("q").value.trim().toLowerCase();
  const L=D.filter(d=>{
    if(S.fav&&!favs.includes(d.w))return false;
    if(S.cat&&d.c!==S.cat)return false;
    if(S.letter&&d.w[0].toUpperCase()!==S.letter)return false;
    if(!q)return true;
    return S.lang==="en"?d.w.toLowerCase().includes(q):(d.p.includes(q)||d.x.includes(q));
  });
  $("cnt").textContent=(S.fav?"Favorites: ":"Words: ")+L.length;
  $("list").innerHTML=L.length?L.map(d=>`<div class="it" data-w="${d.w}">
    <div class="row"><div class="wd"><b>${d.w}</b><div class="p ps">${d.p}</div></div>
    <button class="heart ${favs.includes(d.w)?"f":""}" data-h="${d.w}">${favs.includes(d.w)?"&#9829;":"&#9825;"}</button></div>
    <div class="det"><div><b>Pronunciation:</b> ${d.pr}</div><div>${d.e}</div><div class="ps">${d.x}</div>
    <span class="tag">${d.c}</span><br><button class="spk" data-s="${d.w}">&#128266; Listen</button></div></div>`).join(""):'<div class="empty">No words found / لغت ونه موندل شو</div>';
  document.querySelectorAll(".az span").forEach(s=>s.classList.toggle("on",s.dataset.l===S.letter));
  $("fb").innerHTML=S.fav?"&#9829;":"&#9825;";
}
$("q").oninput=render;
$("cat").onchange=e=>{S.cat=e.target.value;render()};
$("le").onclick=()=>{S.lang="en";$("le").classList.add("on");$("lp").classList.remove("on");$("q").placeholder="Search English word";render()};
$("lp").onclick=()=>{S.lang="ps";$("lp").classList.add("on");$("le").classList.remove("on");$("q").placeholder="پښتو لغت ولټوئ";render()};
$("az").onclick=e=>{const l=e.target.dataset.l;if(!l)return;S.letter=S.letter===l?"":l;render()};
$("list").onclick=e=>{
  const h=e.target.dataset.h,s=e.target.dataset.s;
  if(h){favs=favs.includes(h)?favs.filter(x=>x!==h):[...favs,h];saveFav();render();return}
  if(s){speak(s);return}
  const it=e.target.closest(".it");if(it)it.classList.toggle("open");
};
function speak(t){
  if(!("speechSynthesis" in window)){alert("Speech is not supported on this device.");return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);
}
const drawer=o=>{$("dr").classList.toggle("o",o);$("ov").style.display=o?"block":"none"};
$("mb").onclick=()=>drawer(true);$("ov").onclick=()=>drawer(false);
$("mAll").onclick=()=>{S.fav=false;S.cat="";S.letter="";$("cat").value="";$("q").value="";drawer(false);render()};
$("mFav").onclick=()=>{S.fav=true;drawer(false);render()};
$("fb").onclick=()=>{S.fav=!S.fav;render()};
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("gmd_theme",t)}catch(e){}}
$("mDark").onclick=()=>{theme(document.documentElement.dataset.theme==="dark"?"light":"dark");drawer(false)};
$("mAbout").onclick=()=>{drawer(false);$("ab").style.display="flex"};
$("abx").onclick=()=>$("ab").style.display="none";
try{theme(localStorage.getItem("gmd_theme")||"light")}catch(e){theme("light")}
render();
</script>
</body>
</html>
